<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amWRit</title>
<style type="text/css">
  body {
    background-color: #000;
    margin: 0;
  }
  #console {
    font-family: courier, monospace;
    color: #fff;
    box-sizing: border-box;
    width: 100%;
    max-width: 782px;
    margin: 100px auto 0;
    padding: 0 16px;
    font-size:14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  #console .cursor {
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink {
    to { visibility: hidden; }
  }
  @media (prefers-reduced-motion: reduce) {
    #console .cursor {
      animation: none;
    }
  }
  a {
    color: #0bc;
    text-decoration: none;
  }
  #a {
    color: #0f0;
  }
  #c {
    color: #0bc;
  }
  #b {
    color: #ff0096;
  }
  #g {
	color: #A9A9A9	;
  }
  @media (max-width: 600px) {
    #console {
      margin-top: 32px;
    }
  }

</style>
</head>
<body>

<div id="console" aria-live="off"></div>
<script>
  var consoleElement = document.getElementById("console");
  var Typer = {
    text: "",
    index: 0,
    speed: 3,
    file: "amwrit_puri.html",
    timer: null,
    init: function() {
      fetch(this.file)
        .then(function(response) {
          if (!response.ok) {
            throw new Error("Text request failed");
          }
          return response.text();
        })
        .then(function(data) {
          Typer.text = data.replace(/\r?\n$/, "");

          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            Typer.index = Typer.text.length;
            Typer.render();
            return;
          }

          Typer.timer = window.setInterval(function() {
            Typer.typeNext();
          }, 30);
        })
        .catch(function() {
          consoleElement.textContent = "Unable to load the page text. ";
          var link = document.createElement("a");
          link.href = Typer.file;
          link.textContent = "Open the text directly";
          consoleElement.appendChild(link);
        });
    },
    typeNext: function() {
      this.index = Math.min(this.index + this.speed, this.text.length);
      this.render();

      if (this.index === this.text.length) {
        window.clearInterval(this.timer);
      }
    },
    render: function() {
      var visibleText = this.text.substring(0, this.index).replace(/\n/g, "<br>");
      consoleElement.innerHTML = visibleText + '<span class="cursor">|</span>';
    }
  };

  Typer.init();
</script>
